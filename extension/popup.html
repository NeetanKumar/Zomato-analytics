<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zomato Order Analytics</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Zomato Order Analytics</h1>

  <button id="analyze-btn">Analyze my orders</button>
  <p id="status"></p>

  <div id="results" hidden>
    <section>
      <h2>Overview</h2>
      <div id="overview" class="stat-grid"></div>
    </section>

    <section>
      <h2>Top restaurants by orders</h2>
      <table id="top-by-count"></table>
    </section>

    <section>
      <h2>Top restaurants by spend</h2>
      <table id="top-by-spend"></table>
    </section>

    <section>
      <h2>Spend by month</h2>
      <table id="monthly"></table>
    </section>

    <section id="establishment-section">
      <h2>Orders by establishment type</h2>
      <table id="establishment"></table>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
